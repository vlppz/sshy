<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' http://localhost:*;"
    />
    <meta
      http-equiv="X-Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' http://localhost:*;"
    />
    <title>SSHY - All in one SSH manager</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/auth.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
      // Apply theme immediately to prevent flickering
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = savedTheme || (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          // Add a class to prevent transitions during page load
          document.documentElement.classList.add('no-transition');
          // Remove the class after the page has loaded
          window.addEventListener('load', function() {
            setTimeout(function() {
              document.documentElement.classList.remove('no-transition');
            }, 100);
          });
        } catch(e) {
          console.error('Error setting initial theme:', e);
        }
      })();
    </script>
    <script type="module" src="js/index.bundle.js"></script>
  </head>
  <body>
    <div id="app">
      <button id="theme-toggle"><i class="bi bi-moon"></i></button>
      <div id="auth-container">
        <!-- Login Form -->
        <div id="login-form" class="auth-form">
          <h2>Login</h2>
          <form>
            <div class="form-group">
              <input type="email" id="login-email" placeholder="Email" required>
            </div>
            <div class="form-group">
              <input type="password" id="login-password" placeholder="Password" required>
            </div>
            <button type="submit" id="login-submit">Login</button>
          </form>
          <p class="switch-form">
            Don't have an account? <a href="#" id="show-register">Register</a>
          </p>
        </div>

        <!-- Register Form -->
        <div id="register-form" class="auth-form hidden">
          <h2>Register</h2>
          <form>
            <div class="form-group">
              <input type="email" id="register-email" placeholder="Email" required>
            </div>
            <div class="form-group">
              <input type="password" id="register-password" placeholder="Password" required>
            </div>
            <div class="form-group">
              <input type="password" id="register-confirm-password" placeholder="Confirm Password" required>
            </div>
            <button type="submit" id="register-submit">Register</button>
          </form>
          <p class="switch-form">
            Already have an account? <a href="#" id="show-login">Login</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
